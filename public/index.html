<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hodog Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>🐶 Hodog Chat</h1>

  <input type="text" id="username" placeholder="Felhasználónév">

  <button onclick="login()">Belépés</button>

  <div id="chat" style="display:none;">
    <div id="messages"></div>

    <input type="text" id="message" placeholder="Írj egy üzenetet..." onkeydown="if(event.key==='Enter') sendMessage()">

    <button onclick="sendMessage()">Küldés</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
